<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Ticket Scanner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="/config.js"></script>
  <script src="/demo.js"></script>
  <script src="/lib.js"></script>
</head>
<body>
<header class="brandbar"><div class="inner"><img src="/brand/jesco.png" alt="JESCO"><img class="am" src="/brand/arcelormittal.png" alt="ArcelorMittal Tubular Products Al-Jubail"><span class="title">Safety Event · Check-in</span></div></header>
<main>
  <form id="login" class="card login" hidden>
    <h1>Scanner sign in</h1>
    <div class="field"><label>Email</label><input name="email" type="email" required autocomplete="username"></div>
    <div class="field"><label>Password</label><input name="password" type="password" required autocomplete="current-password"></div>
    <button class="primary" style="width:100%">Sign in</button>
    <p class="login-error"></p>
  </form>

  <div id="app" hidden>
    <div class="row" style="margin-bottom:12px">
      <h1 style="margin:0">Check-in</h1>
      <span class="spacer"></span>
      <button class="small" id="signout">Sign out</button>
    </div>
    <div class="field"><label>Event</label><select id="event"></select></div>
    <div id="reader"></div>
    <div class="row" style="margin-top:12px; justify-content:center">
      <button id="toggle" class="primary">Start camera</button>
    </div>
    <div id="result"></div>
    <details class="card" style="margin-top:16px">
      <summary>Enter code manually</summary>
      <form id="manual" class="row" style="margin-top:12px">
        <input id="manualCode" placeholder="QR code text" style="flex:1">
        <button class="primary">Check</button>
      </form>
    </details>
  </div>
</main>
<script>
(function () {
  const { db, $, esc, fmtDate, setupLogin, signOut } = T;
  let scanner = null, running = false, busy = false, lastCode = '', lastAt = 0;

  const MESSAGES = {
    ticket_redeemed:         ['ok',   'Welcome in ✓'],
    ticket_already_redeemed: ['warn', 'Already used'],
    ticket_cancelled:        ['bad',  'Ticket cancelled'],
    wrong_event:             ['bad',  'Different event'],
    invalid_ticket:          ['bad',  'Not a valid ticket'],
    ticket_expired:          ['bad',  'Ticket expired'],
  };

  async function loadEvents() {
    const { data, error } = await db.rpc('invite_list_events');
    const sel = $('#event');
    if (error) { sel.innerHTML = '<option>Could not load events</option>'; return; }
    sel.innerHTML = data.map((e) => `<option value="${e.id}">${esc(e.name)}</option>`).join('');
  }

  function show(kind, title, detail) {
    $('#result').innerHTML = `<div class="result ${kind}"><h2>${esc(title)}</h2><div>${detail}</div></div>`;
    if (navigator.vibrate) navigator.vibrate(kind === 'ok' ? 80 : [60, 60, 60]);
  }

  async function check(code) {
    code = (code || '').trim();
    // The camera reports the same code many times per second; ignore repeats for 3s.
    if (!code || busy || (code === lastCode && Date.now() - lastAt < 3000)) return;
    busy = true; lastCode = code; lastAt = Date.now();
    try {
      const { data, error } = await db.rpc('invite_scan_ticket', {
        p_qr_token: code, p_event_id: $('#event').value || null,
      });
      if (error) { show('bad', 'Error', esc(error.message)); return; }
      const r = data[0];
      const [kind, title] = MESSAGES[r.status] || ['bad', r.status];
      let detail = r.guest_name ? `<b>${esc(r.guest_name)}</b>` : '';
      if (r.staff_id) detail += `<br>Staff ID ${esc(r.staff_id)}`;
      if (r.note) detail += `<br>${esc(r.note)}`;
      if (r.status === 'ticket_already_redeemed') detail += `<br>at ${esc(fmtDate(r.redeemed_at))}`;
      show(kind, title, detail);
    } finally {
      busy = false;
    }
  }

  async function toggle() {
    const btn = $('#toggle');
    if (running) {
      await scanner.stop();
      running = false; btn.textContent = 'Start camera';
      return;
    }
    scanner = scanner || new Html5Qrcode('reader');
    try {
      await scanner.start({ facingMode: 'environment' }, { fps: 10, qrbox: 250 }, check);
      running = true; btn.textContent = 'Stop camera';
    } catch (e) {
      show('bad', 'Camera unavailable', esc(e.message || e) + '<br>Allow camera access, or enter the code manually.');
    }
  }

  setupLogin({
    form: $('#login'), app: $('#app'), allowed: ['admin', 'scanner'],
    onReady: loadEvents,
  });
  $('#signout').onclick = signOut;
  $('#toggle').onclick = toggle;
  $('#manual').onsubmit = (e) => { e.preventDefault(); lastCode = ''; check($('#manualCode').value); };
})();
</script>
</body>
</html>
